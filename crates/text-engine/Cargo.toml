[package]
name = "text-engine"
version = "0.1.0"
edition = "2021"
authors = ["Arthropod Contributors"]
license = "MIT OR Apache-2.0"
description = "Text shaping and rendering engine for Arthropod GUI framework"

[dependencies]
cosmic-text = "0.12"
unicode-bidi = "0.3"
unicode-segmentation = "1.12"
glam = "0.29"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "shaping_bench"
harness = false
