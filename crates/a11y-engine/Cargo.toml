[package]
name = "a11y-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Accessibility engine for Arthropod GUI framework - WCAG 2.1 compliance and screen reader support"

[dependencies]
log.workspace = true
plat-core = { path = "../plat-core" }
render-engine = { path = "../render-engine" }
bevy_ecs = { version = "0.15", features = ["multi_threaded"] }
accesskit = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_Foundation", "Win32_System_Variant"] }
windows-core = "0.62"
accesskit_windows = "0.32"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# For property-based testing (future)
# proptest = "1.0"

[[bench]]
name = "a11y_benchmarks"
harness = false
