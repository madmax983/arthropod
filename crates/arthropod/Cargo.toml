[package]
name = "arthropod"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Enterprise-grade cross-platform Rust GUI framework"

[dependencies]
plat-core = { path = "../plat-core" }
render-engine = { path = "../render-engine" }
anim-graph = { path = "../anim-graph" }
flux-state = { path = "../flux-state" }
arthropod-ecs = { path = "../arthropod-ecs" }
a11y-engine = { path = "../a11y-engine" }
layout-engine = { path = "../layout-engine" }
widget-core = { path = "../widget-core" }
theme-engine = { path = "../theme-engine" }
pollster.workspace = true
log.workspace = true
env_logger = "0.11"
thiserror.workspace = true
bevy_ecs = { version = "0.15", features = ["multi_threaded"] }
indexmap = "2.13.0"

[dev-dependencies]
glam = "0.29"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "framework_bench"
harness = false

[[bench]]
name = "particles"
harness = false
required-features = ["nova"]

[features]
nova = []
