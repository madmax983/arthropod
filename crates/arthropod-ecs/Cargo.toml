[package]
name = "arthropod-ecs"
version = "0.1.0"
edition = "2021"
authors = ["Arthropod Contributors"]
license = "MIT OR Apache-2.0"
description = "ECS integration layer for Arthropod GUI framework"

[features]
# Enable gather-apply pattern for reactive updates (high overhead, only beneficial at 25K+ entities)
# See docs/performance/parallelization-analysis.md for crossover analysis
parallel-reactive = []

[dependencies]
widget-core = { path = "../widget-core" }
bevy_ecs = { version = "0.15", features = ["multi_threaded"] }
bevy_tasks = "0.15"
render-engine = { path = "../render-engine" }
flux-state = { path = "../flux-state" }
a11y-engine = { path = "../a11y-engine" }
layout-engine = { path = "../layout-engine" }
plat-core = { path = "../plat-core" }
glam = "0.29"
rayon = "1.11"
accesskit = "0.24"  # For ActionRequest in tests

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "ecs_benchmarks"
harness = false
