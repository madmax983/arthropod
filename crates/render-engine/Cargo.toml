[package]
name = "render-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rendering engine for Arthropod GUI framework"

[dependencies]
plat-core = { path = "../plat-core" }
text-engine = { path = "../text-engine" }
style-engine = { path = "../style-engine" }
raw-window-handle.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
tracing.workspace = true
glam.workspace = true
hashbrown.workspace = true
bevy_ecs = { version = "0.15", features = ["multi_threaded"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cosmic-text = "0.12"
rayon = "1.11"
half = "2.4"
lyon = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "scene_bench"
harness = false

[[bench]]
name = "primitive_rendering"
harness = false

[[bench]]
name = "path_pipeline"
harness = false

[[bench]]
name = "phase4_effects"
harness = false

[features]
default = ["native"]
native = []
web = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Navigator"] }
