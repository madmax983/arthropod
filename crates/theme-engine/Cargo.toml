[package]
name = "theme-engine"
version = "0.1.0"
edition = "2021"
authors = ["Arthropod Contributors"]
license = "MIT OR Apache-2.0"
description = "Three-layer theming system for Arthropod GUI framework"

[dependencies]
glam = "0.29"
thiserror = "2.0"
plat-core = { path = "../plat-core" }
style-engine = { path = "../style-engine" }
layout-engine = { path = "../layout-engine" }


[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[dev-dependencies]
