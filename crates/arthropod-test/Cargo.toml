[package]
name = "arthropod-test"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Testing and debugging utilities for Arthropod"

[dependencies]

# GPU debugging
wgpu.workspace = true
renderdoc = "0.11"

# Image processing for visual regression tests
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true

# Testing
anyhow = "1.0"

[features]
default = []
headless = []  # For CI testing without a window
