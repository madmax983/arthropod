[package]
name = "widget-core"
version = "0.1.0"
edition = "2021"
authors = ["Arthropod Contributors"]
license = "MIT OR Apache-2.0"
description = "Core widget system for Arthropod GUI framework"

[dependencies]
render-engine = { path = "../render-engine" }
text-engine = { path = "../text-engine" }
layout-engine = { path = "../layout-engine" }
flux-state = { path = "../flux-state" }
widget-macros = { path = "../widget-macros" }
theme-engine = { path = "../theme-engine" }
glam = "0.29"
bevy_ecs = "0.15"
indexmap = "2.13.0"

[dev-dependencies]
plat-core = { path = "../plat-core" }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "widget_pipeline_bench"
harness = false
