[package]
name = "arthropod-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Internal dependencies
arthropod-ecs = { path = "../arthropod-ecs" }
render-engine = { path = "../render-engine" }
flux-state = { path = "../flux-state" }
plat-core = { path = "../plat-core" }
arthropod-test = { path = "../arthropod-test" }

# MCP SDK
rmcp = { version = "0.13", features = ["server"] }
tokio = { version = "1.0", features = ["full"] }

# ECS
bevy_ecs = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"

# Error handling
anyhow = "1.0"
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Utilities
hashbrown = "0.15"
glam.workspace = true

# CLI / TUI
ratatui = "0.29"
crossterm = "0.28"
regex = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
pollster.workspace = true

[[bin]]
name = "arthropod-mcp"
path = "src/bin/arthropod-mcp.rs"

[[bin]]
name = "bench-viewer"
path = "src/bin/bench-viewer.rs"

[[bench]]
name = "mcp_overhead"
harness = false

[features]
default = ["standalone"]
standalone = []
embedded = []

[[bin]]
name = "mcp-inspector"
path = "src/bin/mcp-inspector.rs"
