[package]
name = "flux-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reactive state management for Arthropod GUI framework"

[features]
nova = ["dep:serde"]

[dependencies]
log.workspace = true
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
loom = "0.7.2"
proptest = "1.4"
