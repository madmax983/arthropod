[package]
name = "flux-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reactive state management for Arthropod GUI framework"

[features]
nova = ["dep:serde"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
loom = "0.7.2"
proptest = "1.4"
