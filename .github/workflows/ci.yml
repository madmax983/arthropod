name: CI

on:
  push:
    branches: [ trunk, main ]
  pull_request:
    branches: [ trunk, main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Job 1: Format Check
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Job 2: Clippy Lints
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Job 3: Test Suite (Multiple Platforms)
  test:
    name: Test Suite
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all --all-features

      - name: Run doc tests
        run: cargo test --doc --all-features

  # Job 4: Build Check (Release)
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --all-features

  # Job 5: Examples Build Check
  examples:
    name: Examples Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build all examples
        run: cargo build --examples --all-features

  # Job 6: Benchmark Regression Check (optional - only on main)
  benchmark:
    name: Benchmark Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/trunk' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Path hot-path benchmark guardrail
        env:
          MAX_NS: "200"
        run: bash .github/scripts/check-path-hot-bench.sh
      - name: Style boolean-op benchmark guardrail
        env:
          BENCH_NAME: "path_boolean_ops/intersect/128"
          MAX_NS: "50000"
        run: bash .github/scripts/check-style-path-bench.sh
      - name: Style hit-test benchmark guardrail
        env:
          BENCH_NAME: "path_hit_test/contains_point_inside"
          MAX_NS: "5000"
        run: bash .github/scripts/check-style-path-bench.sh
      - name: Run benchmarks
        run: cargo bench --all --no-fail-fast -- --output-format bencher | tee output.txt
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Alert if performance degrades by >10%
          alert-threshold: '110%'
          comment-on-alert: true
          fail-on-alert: false

  # Job 7: Coverage (optional - requires tarpaulin)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
      - uses: Swatinem/rust-cache@v2
      - name: Generate coverage
        run: cargo tarpaulin --all-features --workspace --timeout 300 --out Xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Job 8: Security Audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Job 9: Phase 4/5 completion gates (effects + web)
  phase45-gates:
    name: Phase 4/5 Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Phase 4 effects tests
        run: |
          cargo test -p render-engine --test phase4_effects_tests -- --nocapture
          cargo test -p render-engine --test phase4_effect_plan_tests -- --nocapture
          cargo test -p render-engine --test phase4_render_target_pool_tests -- --nocapture
          cargo test -p render-engine --test phase4_blur_execution_tests -- --nocapture
          cargo test -p render-engine --test phase4_background_blur_tests -- --nocapture
          cargo test -p render-engine --test phase4_inner_shadow_tests -- --nocapture
          cargo test -p render-engine --test phase4_stencil_tests -- --nocapture
          cargo test -p render-engine --test phase4_blend_modes_tests -- --nocapture
      - name: Web target checks
        run: |
          cargo check -p plat-core --target wasm32-unknown-unknown --features web
          cargo check -p render-engine --target wasm32-unknown-unknown --features web
          cargo check --example widget_gallery_web --target wasm32-unknown-unknown --features web
      - name: Phase 4 benchmark smoke
        run: cargo bench -p render-engine --bench phase4_effects -- --noplot
      - name: Trunk build smoke
        run: |
          trunk build --example widget_gallery_web --features web
          test -f target/trunk/widget_gallery_web/index.html
          grep -q "Arthropod Widget Gallery Live" target/trunk/widget_gallery_web/index.html
          grep -q 'id="arthropod-canvas"' target/trunk/widget_gallery_web/index.html

  # Job 10: Native desktop visual regression (golden image diff)
  phase4-desktop-visual-regression:
    name: Phase 4 Desktop Visual Regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run desktop golden regression test
        env:
          ARTHROPOD_VISUAL_CHANNEL_TOLERANCE: "2"
          ARTHROPOD_VISUAL_MAX_DIFF_RATIO: "0.04"
        run: cargo test --test phase4_desktop_visual_regression -- --nocapture
      - name: Upload desktop visual artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-desktop-visual-artifacts
          path: tests/visual/artifacts/phase4
          if-no-files-found: ignore
