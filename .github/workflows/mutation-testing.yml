name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Sunday at midnight

env:
  CARGO_TERM_COLOR: always

jobs:
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - uses: Swatinem/rust-cache@v2

      - name: Run mutation testing
        run: cargo mutants --no-shuffle --timeout 300 --all-features
        continue-on-error: true

      - name: Archive mutants results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-results
          path: |
            mutants.out/
            mutants.out.json

      - name: Fail if mutation score too low
        if: always() && hashFiles('mutants.out.json') != ''
        run: |
          SCORE=$(jq -r '(.caught / .total_mutants * 100)' mutants.out.json)
          echo "Mutation score: $SCORE%"
          if (( $(echo "$SCORE < 80.0" | bc -l) )); then
            echo "::error::Mutation score ($SCORE%) is below 80% threshold"
            exit 1
          fi
        shell: bash
