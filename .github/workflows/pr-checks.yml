name: PR Meta Checks

on:
  pull_request:
    branches: [ trunk, main ]

concurrency:
  group: pr-meta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  meta-checks:
    name: PR Meta Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new TODOs
        run: |
          if git diff origin/${{ github.base_ref }}...HEAD | grep -E '^\+.*TODO' > /dev/null; then
            echo "::error::New TODOs found in PR diff"
            exit 1
          fi
          echo "No new TODOs found in PR diff"

      - name: Check for new unsafe code
        run: |
          NEW_UNSAFE=$(git diff origin/${{ github.base_ref }}...HEAD | grep -c '^\+.*unsafe' || true)
          if [ "$NEW_UNSAFE" -gt 0 ]; then
            echo "::warning::New unsafe blocks detected: $NEW_UNSAFE (ensure # Safety docs/invariants)"
          else
            echo "No new unsafe blocks detected"
          fi

  banned-deps:
    name: Check Banned Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check dependencies
        run: cargo deny check

  pr-ready:
    name: PR Ready to Merge
    runs-on: ubuntu-latest
    needs: [meta-checks, banned-deps]
    steps:
      - name: All checks passed
        run: echo "All PR meta checks passed."
