[workspace]
resolver = "2"
members = [
    "crates/plat-core",
    "crates/render-engine",
    "crates/anim-graph",
    "crates/flux-state",
    "crates/arthropod",
    "crates/arthropod-test",
    "crates/arthropod-ecs",
    "crates/a11y-engine",
    "crates/arthropod-mcp",
    "crates/theme-engine",
    "crates/layout-engine",
    "crates/text-engine",
    "crates/widget-core",
    "crates/widget-macros",
    "crates/style-engine",
    "crates/input-engine",
    "experiments/chronos", 
    "experiments/spatial-graph", 
    "experiments/motion", 
    "experiments/flux-devtools", 
    "experiments/tui-renderer",
    "experiments/fluid-layout",
]

[package]
name = "arthropod-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Core dependencies
raw-window-handle = "0.6"
wgpu = "28.0"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
bytemuck = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hashbrown = "0.15"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Math
glam = { version = "0.29", features = ["bytemuck"] }

# Windows platform
[workspace.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_System_Variant",
    "Win32_System_Ole",
]

# macOS platform
[workspace.dependencies.objc2]
version = "0.5"
[workspace.dependencies.objc2-foundation]
version = "0.2"
[workspace.dependencies.objc2-app-kit]
version = "0.2"

# Examples live at workspace root
[[example]]
name = "colored_rectangles"
path = "examples/colored_rectangles.rs"

[[example]]
name = "single_rect_test"
path = "examples/single_rect_test.rs"

[[example]]
name = "debug_render"
path = "examples/debug_render.rs"

[[example]]
name = "form_demo"
path = "examples/form_demo.rs"

[[example]]
name = "glassmorphic_form"
path = "examples/glassmorphic_form.rs"

[[example]]
name = "widget_gallery"
path = "examples/widget_gallery.rs"

[[example]]
name = "widget_gallery_web"
path = "examples/widget_gallery_web.rs"

[[example]]
name = "phase4_visual_web"
path = "examples/phase4_visual_web.rs"

[[example]]
name = "capture_phase4_visuals"
path = "examples/capture_phase4_visuals.rs"

[[example]]
name = "macro_demo"
path = "examples/macro_demo.rs"

[[example]]
name = "native_materials"
path = "examples/native_materials.rs"

[[example]]
name = "directcomposition_demo"
path = "examples/directcomposition_demo.rs"

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "phase3_path_smoke"
path = "examples/phase3_path_smoke.rs"

[[example]]
name = "visual_test_phase4_blur"
path = "examples/visual_test_phase4_blur.rs"

[[example]]
name = "visual_test_phase4_blend"
path = "examples/visual_test_phase4_blend.rs"

[[example]]
name = "visual_test_phase4_clipping"
path = "examples/visual_test_phase4_clipping.rs"

[[example]]
name = "form_syntax_demo"
path = "examples/form_syntax_demo.rs"

[[example]]
name = "riot_waves_generated"
path = "examples/riot_waves_generated.rs"

[[example]]
name = "carousel_demo"
path = "examples/carousel_demo.rs"

[features]
default = ["native"]
native = ["plat-core/native", "render-engine/native"]
web = ["plat-core/web", "render-engine/web"]
nova = ["arthropod/nova"]

[dependencies]
plat-core = { path = "crates/plat-core" }
render-engine = { path = "crates/render-engine" }
widget-core = { path = "crates/widget-core" }
flux-state = { path = "crates/flux-state" }
style-engine = { path = "crates/style-engine" }
glam = "0.29"
arthropod-ecs = { path = "crates/arthropod-ecs" }
a11y-engine = { path = "crates/a11y-engine" }
theme-engine = { path = "crates/theme-engine" }
env_logger.workspace = true
tracing.workspace = true
serde_json = "1.0"
tracing-subscriber.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arthropod = { path = "crates/arthropod" }
render-engine = { path = "crates/render-engine" }
arthropod-mcp = { path = "crates/arthropod-mcp" }
arthropod-test = { path = "crates/arthropod-test" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
scraper = { version = "0.25", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Location", "HtmlElement"] }
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ratatui = "0.30"
crossterm = "0.28"
flux-devtools = { path = "experiments/flux-devtools" }
