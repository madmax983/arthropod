[workspace]
resolver = "2"
members = [
    "crates/plat-core",
    "crates/render-engine",
    "crates/anim-graph",
    "crates/flux-state",
    "crates/arthropod",
    "crates/arthropod-test",
    "crates/arthropod-ecs",
    "crates/a11y-engine",
    "crates/arthropod-mcp",
    "crates/theme-engine",
    "crates/layout-engine",
    "crates/text-engine",
    "crates/widget-core",
    "crates/widget-macros",
]

[package]
name = "arthropod-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Core dependencies
raw-window-handle = "0.6"
wgpu = "24.0"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
bytemuck = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
hashbrown = "0.15"

# Layout
taffy = "0.6"

# Text
rustybuzz = "0.20"
swash = "0.1"
unicode-bidi = "0.3"
unicode-segmentation = "1.12"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Math
glam = { version = "0.29", features = ["bytemuck"] }

# Windows platform
[workspace.dependencies.windows]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
]

# macOS platform
[workspace.dependencies.objc2]
version = "0.5"
[workspace.dependencies.objc2-foundation]
version = "0.2"
[workspace.dependencies.objc2-app-kit]
version = "0.2"

# Examples live at workspace root
[[example]]
name = "colored_rectangles"
path = "examples/colored_rectangles.rs"

[[example]]
name = "single_rect_test"
path = "examples/single_rect_test.rs"

[[example]]
name = "debug_render"
path = "examples/debug_render.rs"

[[example]]
name = "form_demo"
path = "examples/form_demo.rs"

[[example]]
name = "widget_gallery"
path = "examples/widget_gallery.rs"

[[example]]
name = "macro_demo"
path = "examples/macro_demo.rs"

[dependencies]
arthropod = { path = "crates/arthropod" }
plat-core = { path = "crates/plat-core" }
render-engine = { path = "crates/render-engine", features = ["renderdoc"] }
anim-graph = { path = "crates/anim-graph" }
widget-core = { path = "crates/widget-core" }
flux-state = { path = "crates/flux-state" }
text-engine = { path = "crates/text-engine" }
glam = "0.29"
arthropod-test = { path = "crates/arthropod-test" }
arthropod-ecs = { path = "crates/arthropod-ecs" }
arthropod-mcp = { path = "crates/arthropod-mcp" }
env_logger.workspace = true
tracing.workspace = true
serde_json = "1.0"
tracing-subscriber.workspace = true
